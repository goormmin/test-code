# This workflow will install java
# .github/workflows/app-android.yml
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: app-build CI

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '05 * * * *'

jobs:
  build-1:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-1.jar
        bash mpstat.sh
        
  build-2:
    if: always()
    needs: build-1
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-2.jar
        bash mpstat.sh
        
  build-3:
    if: always()
    needs: [build-1,build-2]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-3.jar
        bash mpstat.sh
        
  build-4:
    if: always()
    needs: [build-1,build-2,build-3]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-4.jar
        bash mpstat.sh
        
  build-5:
    if: always()
    needs: [build-1,build-2,build-3,build-4]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-5.jar
        bash mpstat.sh
        
  build-6:
    if: always()
    needs: [build-1,build-2,build-3,build-4,build-5]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'
    - name: Build with Gradle
      run: |
        java -jar build-6.jar
        bash mpstat.sh
        
